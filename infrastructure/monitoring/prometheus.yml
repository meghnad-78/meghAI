global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'meghai-api'
    static_configs:
      - targets: ['localhost:4820']
    metrics_path: '/api/metrics'

  - job_name: 'meghai-windows-agent'
    static_configs:
      - targets: ['localhost:4821']
    metrics_path: '/metrics'
